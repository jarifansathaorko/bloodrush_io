<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: black; color: lime; font-family: monospace; padding: 20px; }
  </style>
</head>
<body>
  <h1>Debug Log</h1>
  <div id="log"></div>
  <canvas id="game-canvas" width="800" height="600" style="display:none;"></canvas>
  <canvas id="hero-canvas" width="400" height="400" style="display:none;"></canvas>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.getElementById('log').innerHTML += `<p style="color:red">ERROR: ${msg}<br>${url}:${line}:${col}<br>${error && error.stack ? error.stack : ''}</p>`;
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('log').innerHTML += `<p style="color:orange">PROMISE REJECTION: ${e.reason}</p>`;
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
